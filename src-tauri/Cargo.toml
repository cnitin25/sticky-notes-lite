[package]
name = "sticky-notes-lite"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sticky_notes_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Drop the linker's CodeView entry (and the sticky_notes_lite.pdb reference
# with it). The absolute .cargo/.rustup paths are a separate problem -- they
# are panic-location strings in .rdata, not debug info, so `strip` does not
# touch them; build via build-release.ps1, which passes --remap-path-prefix.
# (`trim-paths` would be the tidier fix but is still unstable in Cargo 1.98.)
strip = true
